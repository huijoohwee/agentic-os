name: Enforce owner reuse
description: Check the committed candidate against verified owner sources and the consumer's audited baseline.
inputs:
  baseline:
    description: Full audited consumer commit
    required: true
  checkout:
    description: Checkout relative to the workspace
    default: "."
runs:
  using: composite
  steps:
    - shell: bash
      env:
        AUDITED_BASE: ${{ inputs.baseline }}
        CONSUMER_PATH: ${{ inputs.checkout }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        FETCH_TOKEN: ${{ github.token }}
        AOS_ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE/$CONSUMER_PATH"
        [[ "$AUDITED_BASE" =~ ^[0-9a-f]{40}$ ]]
        [[ "$GITHUB_REPOSITORY" =~ ^huijoohwee/[A-Za-z0-9.-]+$ ]]
        candidate=$(git rev-parse HEAD)
        [[ "$candidate" = "$GITHUB_SHA" || "$candidate" = "$PR_HEAD" ]]
        protected_base=$(CANDIDATE_REVISION="$candidate" node --input-type=module <<'NODE'
        import { execFileSync } from 'node:child_process';
        import { readFileSync } from 'node:fs';
        const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
        const value = process.env.GITHUB_EVENT_NAME === 'pull_request' ? event.pull_request?.base?.sha
          : process.env.GITHUB_EVENT_NAME === 'merge_group' ? event.merge_group?.base_sha
            : process.env.GITHUB_EVENT_NAME === 'push' ? event.before : process.env.GITHUB_SHA;
        const candidate = process.env.CANDIDATE_REVISION;
        const parents = /^[a-f0-9]{40}$/.test(candidate ?? '')
          ? execFileSync('git', ['show', '-s', '--format=%P', candidate], { encoding: 'utf8' }).trim().split(/\s+/).filter(Boolean)
          : [];
        const revision = candidate === process.env.GITHUB_SHA && parents.length > 0
          ? parents[0]
          : /^[a-f0-9]{40}$/.test(value ?? '') && !/^0+$/.test(value) ? value : process.env.GITHUB_SHA;
        if (!/^[a-f0-9]{40}$/.test(revision) || /^0+$/.test(revision)) process.exit(1);
        process.stdout.write(revision);
        NODE
        )
        fetch_commit() {
          local revision="$1"
          if ! git cat-file -e "$revision^{commit}" 2>/dev/null; then
            auth=$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 | tr -d '\n')
            GIT_AUTH_HEADER="AUTHORIZATION: basic $auth" git -c http.https://github.com/.extraheader= --config-env=http.https://github.com/.extraheader=GIT_AUTH_HEADER \
              fetch --quiet --depth=1 --no-tags --no-recurse-submodules \
              "https://github.com/$GITHUB_REPOSITORY.git" "$revision"
          fi
          git cat-file -e "$revision^{commit}"
        }
        fetch_commit "$AUDITED_BASE"
        fetch_commit "$protected_base"
        unset FETCH_TOKEN auth GIT_AUTH_HEADER
        node "$GITHUB_ACTION_PATH/../../../scripts/check-owner-reuse.mjs" --root=. \
          --repo="${GITHUB_REPOSITORY#*/}" --base="$AUDITED_BASE" --revision="$candidate"
        if [[ "$GITHUB_REPOSITORY" != "huijoohwee/agentic-os" ]]; then
          action_revision="${AOS_ACTION_REF:-}"
          [[ "$action_revision" =~ ^[0-9a-f]{40}$ ]]
          node "$GITHUB_ACTION_PATH/../../../scripts/check-consumer-release.mjs" --root=. \
            --base="$protected_base" --revision="$candidate" --repository="$GITHUB_REPOSITORY" \
            --aos-revision="$action_revision"
        fi
