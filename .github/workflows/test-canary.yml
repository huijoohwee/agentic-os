name: Test canary
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-canary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure Git fixture identity
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name "ADLC CI"
          git config --global init.defaultBranch main
      - run: npm run check:all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: .git/agentic-os-tests/*.*
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
