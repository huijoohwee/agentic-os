name: CI

# `merge_group` is what makes the merge queue work. Without it, queued batches
# never report a status and the queue stalls on every entry.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Job names are the required check contexts in src/queue.mjs REQUIRED_CHECKS.
  # Renaming a job here without updating that list stalls the queue.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hydrate exact event baseline
        shell: bash
        run: |
          base="$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const base = process.env.GITHUB_EVENT_NAME === 'pull_request' ? event.pull_request?.base?.sha
            : process.env.GITHUB_EVENT_NAME === 'merge_group' ? event.merge_group?.base_sha
              : process.env.GITHUB_EVENT_NAME === 'push' ? event.before : null;
          if (!/^[a-f0-9]{40}$/.test(base ?? '') || /^0+$/.test(base)) process.exit(1);
          process.stdout.write(base);
          NODE
          )"
          if ! GIT_NO_LAZY_FETCH=1 GIT_NO_REPLACE_OBJECTS=1 git -c core.fsmonitor=false cat-file -e "$base^{commit}" 2>/dev/null; then
            GIT_NO_LAZY_FETCH=1 GIT_NO_REPLACE_OBJECTS=1 timeout 60s git -c core.fsmonitor=false fetch --no-tags --no-recurse-submodules --depth=1 origin "$base"
          fi
          GIT_NO_LAZY_FETCH=1 GIT_NO_REPLACE_OBJECTS=1 git -c core.fsmonitor=false cat-file -e "$base^{commit}"
      - name: Configure identity for git fixtures
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name "ADLC CI"
          git config --global init.defaultBranch main
      # Event-bound affected closure; packaging runs when its contracts are affected.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:ci

  budgets:
    name: budgets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run evals
        working-directory: ${{ github.workspace }}
